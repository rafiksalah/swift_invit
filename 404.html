<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SwiftInvite Client Preview</title>
  <script>
    // Single Page Apps for GitHub Pages
    // Redirects all 404 paths back to index.html with appropriate hash
    var segmentCount = 1;
    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/#' +
      path + (l.search ? '&' + l.search.slice(1) : '') + l.hash
    );
  </script>
</head>
<body>
  Redirecting to SwiftInvite client preview...
</body>
</html>
